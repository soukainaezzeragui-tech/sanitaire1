<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bricolage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ================= SCREEN LOGIN ================= -->
  <section id="view-login" class="login-screen">
    <form id="login-form" autocomplete="off" novalidate>
      <div class="login-card">
        <div class="login-logo">
          <span class="logo-badge">BR</span>
        </div>
        <h1 class="login-title">Bricolage</h1>
        <p class="login-subtitle">Connexion</p>

        <label class="field">
          <span class="field-label">Code d'accès</span>
          <input type="password" id="login-code" class="input" placeholder="••••" required>
        </label>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Se connecter</button>
        <p id="login-error" class="form-error"></p>
      </div>
    </form>
  </section>

  <!-- ================= APPLICATION SHELL ================= -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="logo-badge small">BR</span>
        <div>
          <div class="brand-name">Bricolage</div>
          <div class="brand-sub">Espace interne</div>
        </div>
      </div>
      <nav class="topnav" id="topnav">
        <button class="nav-link active" data-view="produits">Produits</button>
        <button class="nav-link" data-view="ajouter">Ajouter</button>
        <button class="nav-link" data-view="parametres">Paramètres</button>
      </nav>
      <div class="topbar-user">
        <button class="btn btn-ghost" id="btn-logout" title="Déconnexion">Déconnexion</button>
      </div>
    </header>

    <main class="main" id="main">
      <!-- Vue courante rendue ici par app.js -->
    </main>
  </div>

  <!-- Message flottant (toast) -->
  <div id="toast" class="toast hidden"></div>

  <!-- Bibliothèques JS -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloudinary.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/list.js"></script>
  <script src="js/views/add.js"></script>
  <script src="js/views/edit.js"></script>
  <script src="js/views/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
